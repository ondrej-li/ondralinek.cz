# Security headers for ondralinek.cz.
#
# add_header does not accumulate across levels: a location that sets any header
# drops the ones inherited from the server block, so include this file in every
# location that adds headers of its own.
add_header Strict-Transport-Security    "max-age=31536000" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# The site is fully self-hosted: no fonts, scripts, images or analytics from
# third parties. There are no inline styles or scripts, so the policy needs no
# 'unsafe-inline' escape hatch.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;
