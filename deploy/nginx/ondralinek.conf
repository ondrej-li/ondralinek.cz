# ondralinek.cz — landing page for the apps, sites and open-source projects.
# Installed as /etc/nginx/sites-available/ondralinek by deploy/deploy.sh.
# Source of truth: https://github.com/ondrej-li/ondralinek.cz/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name ondralinek.cz www.ondralinek.cz;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ondralinek;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ondralinek.cz www.ondralinek.cz;

    root /var/www/ondralinek;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ondralinek.access.log;
    error_log  /var/log/nginx/ondralinek.error.log;

    include /etc/nginx/snippets/ondralinek-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        include /etc/nginx/snippets/ondralinek-headers.conf;
    }

    # Pages are never cached, so a deploy is visible immediately. Their assets
    # carry a content hash in the URL and can be cached for a long time.
    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
        include /etc/nginx/snippets/ondralinek-headers.conf;
    }

    location ~* \.(css|js)$ {
        expires 1y;
        include /etc/nginx/snippets/ondralinek-headers.conf;
    }

    location ~* \.(png|svg|webp|jpg|jpeg|ico)$ {
        expires 30d;
        include /etc/nginx/snippets/ondralinek-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
