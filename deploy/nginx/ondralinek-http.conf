# ondralinek.cz — HTTP only, used until the TLS certificate exists.
# deploy/enable-tls.sh swaps this for ondralinek.conf once DNS points here.
# Source of truth: https://github.com/ondrej-li/ondralinek.cz/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name ondralinek.cz;

    root /var/www/ondralinek;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/ondralinek.access.log;
    error_log  /var/log/nginx/ondralinek.error.log;

    # Plain HTTP headers only: HSTS and upgrade-insecure-requests belong to the
    # TLS vhost and would break the site while it is still served over HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Let's Encrypt validates through this path while the site is HTTP only.
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
    }

    location ~* \.(css|js|png|svg|webp|ico)$ {
        expires 30d;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
