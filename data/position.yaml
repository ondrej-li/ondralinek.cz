# Current position — where I am, not what I do. Drives the map card in the
# About section and the `whoami` line in the console.
#
# An email about the position updates THIS FILE ONLY (see AGENTS.md). Nothing
# else on the page changes with it.
#
# location is free text in both languages: anything from a street to a country
# ("Prague, Czechia", "Czechia", "Remote"). coords is optional — decimal
# degrees, south and west negative — and draws the marker on the map.
# note is an optional sentence shown under the place.

