baseURL = "https://ondralinek.cz/"
title = "Ondra Linek"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Single-page site: no taxonomy lists, no RSS feeds.
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  author = "Ondra Linek"
  email = "me@ondralinek.cz"
  github = "https://github.com/ondrej-li"
  githubUser = "ondrej-li"
  cv = "https://me.ondralinek.cz/"
  source = "https://github.com/ondrej-li/ondralinek.cz"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-GB"
    contentDir = "content/en"
    weight = 1
    title = "Ondra Linek — sites, apps & open source"
    [languages.en.params]
      description = "Forward deployed engineer Ondra Linek — product ownership, delivery and hands-on work in Go, SQL, cloud and LLM agents, plus native apps for Apple platforms."

  [languages.cs]
    languageName = "Čeština"
    languageCode = "cs-CZ"
    contentDir = "content/cs"
    weight = 2
    title = "Ondra Linek — weby, aplikace a open source"
    [languages.cs.params]
      description = "Forward deployed engineer Ondra Linek — produkt, dodávka a práce rukama v Go, SQL, cloudu a LLM agentech, plus nativní aplikace pro platformy Apple."

[markup]
  [markup.goldmark.renderer]
    unsafe = true
